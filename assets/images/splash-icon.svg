<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Celestial Gold Ambient Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Celestial Glow -->
  <circle cx="512" cy="420" r="380" fill="url(#goldGlow)" />

  <!-- Constellation Lines (Celestial Gold) -->
  <g stroke="#E5C158" stroke-width="6" opacity="0.9" stroke-linecap="round">
    <line x1="512" y1="200" x2="362" y2="300" />
    <line x1="362" y1="300" x2="420" y2="420" />
    <line x1="512" y1="200" x2="662" y2="300" />
    <line x1="662" y1="300" x2="604" y2="420" />
    <line x1="512" y1="200" x2="512" y2="350" />
    <line x1="512" y1="350" x2="420" y2="420" />
    <line x1="512" y1="350" x2="604" y2="420" />
    <line x1="362" y1="300" x2="260" y2="240" />
    <line x1="662" y1="300" x2="764" y2="240" />
  </g>

  <!-- Constellation Stars -->
  <g>
    <!-- Star 1: Top Center (Polaris motif) -->
    <circle cx="512" cy="200" r="24" fill="#FFFDF7" />
    <circle cx="512" cy="200" r="38" fill="none" stroke="#E5C158" stroke-width="4" opacity="0.75" />
    
    <!-- Star 2: Left Upper -->
    <circle cx="362" cy="300" r="16" fill="#FFFDF7" />
    <circle cx="362" cy="300" r="22" fill="none" stroke="#E5C158" stroke-width="2" opacity="0.5" />
    
    <!-- Star 3: Right Upper -->
    <circle cx="662" cy="300" r="16" fill="#FFFDF7" />
    <circle cx="662" cy="300" r="22" fill="none" stroke="#E5C158" stroke-width="2" opacity="0.5" />

    <!-- Star 4: Center Mid -->
    <circle cx="512" cy="350" r="14" fill="#E5C158" />
    <circle cx="512" cy="350" r="6" fill="#FFFDF7" />

    <!-- Star 5: Left Lower -->
    <circle cx="420" cy="420" r="18" fill="#FFFDF7" />
    <circle cx="420" cy="420" r="28" fill="none" stroke="#E5C158" stroke-width="3" opacity="0.6" />

    <!-- Star 6: Right Lower -->
    <circle cx="604" cy="420" r="18" fill="#FFFDF7" />
    <circle cx="604" cy="420" r="28" fill="none" stroke="#E5C158" stroke-width="3" opacity="0.6" />

    <!-- Star 7: Far Left -->
    <circle cx="260" cy="240" r="12" fill="#E5C158" />

    <!-- Star 8: Far Right -->
    <circle cx="764" cy="240" r="12" fill="#E5C158" />
  </g>

  <!-- Sparkling Cross Flares for Polaris Star -->
  <path d="M 512 140 L 512 260 M 452 200 L 572 200" stroke="#FFFDF7" stroke-width="7" stroke-linecap="round" opacity="0.95" />
  <path d="M 512 165 L 512 235 M 477 200 L 547 200" stroke="#E5C158" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Open Book Symbol -->
  <g transform="translate(0, 100)">
    <!-- Book Shadow Base -->
    <path d="M 512 600 C 400 580 250 630 180 670 L 180 470 C 250 430 400 380 512 400 C 624 380 774 430 844 470 L 844 670 C 774 630 624 580 512 600 Z" fill="#04060B" opacity="0.3" />

    <!-- Left Page Outer Cover (Deep Celestial Indigo) -->
    <path d="M 512 590 C 390 560 230 610 160 650 L 160 450 C 230 410 390 360 512 390 Z" fill="#172554" />
    
    <!-- Right Page Outer Cover (Deep Celestial Indigo) -->
    <path d="M 512 590 C 634 560 794 410 864 450 L 864 650 C 794 610 634 560 512 590 Z" fill="#172554" />

    <!-- Left Page Base (Celestial Gold Edge) -->
    <path d="M 512 580 C 390 550 240 600 170 640 L 170 440 C 240 400 390 350 512 380 Z" fill="#D4AF37" />

    <!-- Right Page Base (Celestial Gold Edge) -->
    <path d="M 512 580 C 634 550 784 400 854 440 L 854 640 C 784 600 634 550 512 580 Z" fill="#D4AF37" />

    <!-- Left Page Paper (Warm Starlight Ivory / Parchment) -->
    <path d="M 508 575 C 388 545 242 590 180 630 L 180 430 C 242 390 388 345 508 375 Z" fill="#FAF8F5" />

    <!-- Right Page Paper (Warm Starlight Ivory / Parchment) -->
    <path d="M 516 575 C 636 545 782 590 844 630 L 844 430 C 782 390 636 345 516 375 Z" fill="#FAF8F5" />

    <!-- Pages Layer Details -->
    <path d="M 220 460 C 280 430 380 400 470 415" stroke="#E2D9C8" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 220 500 C 280 470 380 440 470 455" stroke="#E2D9C8" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 220 540 C 280 510 380 480 470 495" stroke="#E2D9C8" stroke-width="6" stroke-linecap="round" fill="none" />

    <path d="M 804 460 C 744 430 644 400 554 415" stroke="#E2D9C8" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 804 500 C 744 470 644 440 554 455" stroke="#E2D9C8" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 804 540 C 744 510 644 480 554 495" stroke="#E2D9C8" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Book Spine/Center Shadow -->
    <path d="M 508 375 Q 512 373 516 375 L 516 580 Q 512 582 508 580 Z" fill="#070B14" opacity="0.45" />
  </g>
</svg>
